name: Content Backup

# AUTOMATED CONTENT BACKUP (2026-08 추가): 매일 자동 실행되어 공개
# 콘텐츠(공지사항, 교육과정, 인기강좌, 개강 팝업 설정)의 날짜별 JSON
# 스냅샷을 backups/ 폴더에 커밋합니다. 관리자 모드에서 실수로 잘못
# 삭제하거나 잘못 수정했을 때를 대비한 안전망입니다 — 수강신청자/수강생
# 등 개인정보는 포함하지 않습니다(scripts/backup-content.mjs 상단 설명
# 참고). Actions 탭에서 수동 실행(workflow_dispatch)도 가능합니다.

on:
  schedule:
    # 18:00 UTC = 03:00 KST — 트래픽이 적은 새벽 시간에 하루 한 번 실행
    - cron: '0 18 * * *'
  workflow_dispatch: {}

permissions:
  contents: write

jobs:
  backup:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
      - run: node scripts/backup-content.mjs
      - name: Commit backup file if changed
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "github-actions[bot]@users.noreply.github.com"
          git add backups/
          if git diff --cached --quiet; then
            echo "No content changes since last backup — nothing to commit."
          else
            git commit -m "chore: automated content backup $(date -u +%Y-%m-%d)"
            git push
          fi
