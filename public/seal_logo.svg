<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 200 200" width="200" height="200">
  <defs>
    <style>
      @import url('https://fonts.googleapis.com/css2?family=Noto+Sans+KR:wght@700;800;900&amp;family=Outfit:wght@700;800;900&amp;display=swap');
      .seal-kr {
        font-family: 'Noto Sans KR', 'Malgun Gothic', '맑은 고딕', sans-serif;
        font-weight: 800;
        font-size: 15px;
        fill: #0a2e46;
        letter-spacing: 0.5px;
      }
      .seal-en {
        font-family: 'Outfit', 'Arial', sans-serif;
        font-weight: 800;
        font-size: 13.5px;
        fill: #0a2e46;
        letter-spacing: 1.2px;
      }
      .ja-text {
        font-family: 'Outfit', 'Arial', sans-serif;
        font-weight: 900;
        font-size: 27px;
        fill: #005b76;
      }
    </style>
    <!-- Top Arc Path for Korean Text -->
    <path id="sealTopArc" d="M 24,100 A 76,76 0 1,1 176,100" fill="none" />
    <!-- Bottom Arc Path for English Text -->
    <path id="sealBottomArc" d="M 176,100 A 76,76 0 0,1 24,100" fill="none" />
  </defs>

  <!-- Outer Ring Background & Border -->
  <circle cx="100" cy="100" r="96" fill="#ffffff" stroke="#0a2e46" stroke-width="3.5" />
  <circle cx="100" cy="100" r="66" fill="none" stroke="#0a2e46" stroke-width="1.8" />

  <!-- Top Curved Text: 홍천 중앙정보처리학원 -->
  <text class="seal-kr">
    <textPath href="#sealTopArc" startOffset="50%" text-anchor="middle">홍천 중앙정보처리학원</textPath>
  </text>

  <!-- Bottom Curved Text: HONGCHEON ACADEMY -->
  <text class="seal-en">
    <textPath href="#sealBottomArc" startOffset="50%" text-anchor="middle">HONGCHEON ACADEMY</textPath>
  </text>

  <!-- Left & Right Separator Dots -->
  <circle cx="23" cy="100" r="3" fill="#0a2e46" />
  <circle cx="177" cy="100" r="3" fill="#0a2e46" />

  <!-- Inner Globe Symbol -->
  <g id="inner-globe">
    <!-- Globe Outer Circle -->
    <circle cx="100" cy="100" r="52" fill="none" stroke="#005b76" stroke-width="2.5" />

    <!-- Vertical Axis -->
    <line x1="100" y1="48" x2="100" y2="152" stroke="#005b76" stroke-width="2.2" />

    <!-- Globe Latitude Arcs (Top & Bottom) -->
    <path d="M 53,78 Q 100,90 147,78" fill="none" stroke="#005b76" stroke-width="1.8" />
    <path d="M 53,122 Q 100,110 147,122" fill="none" stroke="#005b76" stroke-width="1.8" />

    <!-- Globe Longitude Meridians (Curving right) -->
    <path d="M 100,48 C 128,70 128,130 100,152" fill="none" stroke="#005b76" stroke-width="2.2" />
    <path d="M 100,48 C 145,70 145,130 100,152" fill="none" stroke="#005b76" stroke-width="1.6" />

    <!-- Horizontal Equator Line tapering right -->
    <path d="M 100,100 L 152,100" stroke="#005b76" stroke-width="2.2" />
    <path d="M 100,100 Q 128,92 148,84" fill="none" stroke="#005b76" stroke-width="1.5" />
    <path d="M 100,100 Q 128,108 148,116" fill="none" stroke="#005b76" stroke-width="1.5" />

    <!-- JA Letters on Left Hemisphere -->
    <text x="61" y="110" class="ja-text">JA</text>
  </g>
</svg>
